<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PriorityAirDemo</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #243334; background: #f5f7f7; font-size: 14px; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100%, 1000px); margin: 0 auto; padding: 24px 24px 32px; }
    .meta, .legend, .controls { max-width: 612px; }
    .airspace-layout { display: grid; grid-template-columns: minmax(0, 612px) minmax(260px, 1fr); gap: 28px; align-items: start; }
    .chart { min-width: 0; }
    .chart-area { position: relative; }
    .chart-x-label, .chart-axis-label { position: absolute; font-size: 11px; color: #596767; background: #f5f7f7; padding: 2px 4px; pointer-events: none; }
    .chart-x-label { right: 20px; bottom: 50px; }
    .chart-axis-label { left: 50px; top: 18px; }
    .plot-legend { position: absolute; right: 20px; top: 38px; display: grid; gap: 3px; font-size: 10px; background: #f5f7f7; padding: 2px 4px; }
    .plot-legend > span { display: grid; grid-template-columns: 12px 28px 8px 6ch auto; align-items: center; gap: 3px; white-space: nowrap; }
    .plot-legend > span::before { content: ''; width: 12px; border-top: 2px solid currentColor; }
    .plot-legend output { text-align: right; }
    .plot-legend .equals { text-align: center; }
    .plot-legend math, .chart-axis-label math { font-size: 12px; }
    .series-total { color: #007f76; }
    .series-standard { color: #2478d4; }
    .series-priority { color: #d93644; }
    #flow-chart, #accumulation-chart { aspect-ratio: auto; height: 280px; border: 0; background: transparent; }
    .accumulation-panel { margin-top: 12px; }
    .time-controls { display: flex; align-items: center; gap: 6px; min-width: 0; margin-right: auto; }
    #speed { width: 90px; min-width: 32px; }
    #speed-value { min-width: 28px; }
    .status-time { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    #clock { white-space: nowrap; text-align: right; }
    @media (max-width: 850px) {
      main { max-width: 660px; }
      .airspace-layout { grid-template-columns: minmax(0, 1fr); gap: 8px; }
    }
    header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
    .title-block { display: grid; gap: 2px; flex-shrink: 0; }
    .byline { margin: 0; font-size: 12px; line-height: 1.2; color: #596767; white-space: nowrap; }
    .byline em { font-style: italic; }
    .brand-logos { display: flex; align-items: center; gap: 10px; flex-shrink: 0; margin-left: auto; }
    .brand-logos img { display: block; height: 22px; width: auto; object-fit: contain; }
    .brand-logos a { display: flex; align-items: center; }
    .airspace-meta { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px; }
    h1 { font-size: 22px; margin: 0; font-weight: 650; }
    .status { display: flex; gap: 7px; align-items: center; font-size: 12px; color: #596767; white-space: nowrap; }
    .status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #849292; }
    .status[data-running="true"]::before { background: #007f76; }
    .meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; font-size: 12px; margin-bottom: 10px; color: #596767; }
    output { font-variant-numeric: tabular-nums; }
    .airspace { position: relative; padding: 0 0 28px 28px; }
    .legend { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; font-size: 12px; }
    .legend output { color: #596767; }
    .legend > span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex-shrink: 0; }
    .legend i { width: 8px; height: 8px; border-radius: 50%; background: #d93644; }
    .legend .standard { background: #2478d4; }
    .equation { margin: 0; color: #596767; }
    .alpha-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; white-space: nowrap; }
    .control .alpha-heading label { margin: 0; white-space: normal; }
    @media (max-width: 400px) { .alpha-heading { font-size: 12px; } .alpha-heading math { font-size: 13px; } }
    math { font-size: 16px; }
    canvas { display: block; width: 100%; aspect-ratio: 1; background: #fff; border: 1px solid #788d8b; }
    .x-axis { position: absolute; bottom: 4px; left: 28px; right: 0; text-align: center; font-size: 12px; }
    .y-axis { position: absolute; left: 0; top: 0; bottom: 28px; writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-size: 12px; }
    .controls { margin-top: 16px; }
    .control { margin-bottom: 20px; }
    .control label { display: block; margin-bottom: 8px; font-weight: 550; }
    .unit { font-weight: 400; color: #687878; }
    .control-row { display: grid; grid-template-columns: minmax(0, 1fr) 88px; gap: 18px; align-items: center; }
    input[type="range"] { width: 100%; margin: 0; height: 32px; accent-color: #007f76; cursor: pointer; }
    #alpha-range { accent-color: #ba5c39; }
    input[type="number"] { width: 100%; height: 36px; padding: 6px 8px; background: white; border: 1px solid #b8c4c3; border-radius: 4px; font: inherit; font-variant-numeric: tabular-nums; }
    .limits { display: flex; justify-content: space-between; margin-right: 106px; font-size: 11px; color: #718080; }
    .actions { display: flex; gap: 8px; border-top: 1px solid #dbe2e1; padding-top: 18px; }
    .visibility { display: flex; gap: 8px; margin-left: auto; }
    .visibility button { width: auto; padding: 0 10px; font-size: 12px; gap: 6px; }
    .visibility button[aria-pressed="true"] { background: #e8f2f0; border-color: #8aada7; }
    button { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; width: 40px; height: 40px; padding: 0; font: inherit; font-weight: 550; border: 1px solid #b8c4c3; border-radius: 4px; background: white; color: #243334; cursor: pointer; }
    button img { width: 18px; height: 18px; }
    #toggle img { filter: invert(1); }
    #toggle { background: #007f76; border-color: #007f76; color: white; }
    button:hover { filter: brightness(.95); }
    :focus-visible { outline: 3px solid #65acda; outline-offset: 3px; }
    @media (max-width: 400px) {
      main { padding: 18px 16px; }
      h1 { font-size: 15px; line-height: 1; }
      .byline { font-size: 7px; line-height: 1; }
      .title-block { gap: 1px; }
      header { gap: 8px; }
      .brand-logos { gap: 6px; }
      .brand-logos img { height: 15px; }
      .meta, .status, .legend { font-size: 11px; }
      .status-time { gap: 6px; }
      .legend { gap: 8px; }
      .legend > span { gap: 4px; }
      #speed { width: 60px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="title-block">
        <h1>PriorityAirDemo</h1>
        <p class="byline">Ran Chen, <em>Urban Transport Systems Lab, EPFL</em></p>
      </div>
      <div class="brand-logos">
        <img class="epfl-logo" src="assets/logos/LOGO_EPFL.svg" alt="EPFL" width="182" height="53">
        <a href="https://www.epfl.ch/labs/luts/" aria-label="EPFL Urban Transport Systems Laboratory" title="EPFL LUTS">
          <img class="luts-logo" src="assets/logos/LOGO_LUTS.png" alt="LUTS" width="947" height="315">
        </a>
      </div>
    </header>
    <div class="meta"><div class="airspace-meta"><span>2D airspace · 500 m × 500 m</span><div class="status-time"><span id="status" class="status" data-running="false" role="status">Ready</span><output id="clock" aria-label="Simulation time">t = 00:00</output></div></div>
    </div>
    <div class="legend" aria-label="Drone classes">
      <div class="time-controls"><label for="speed">Speed</label><input id="speed" type="range" min="1" max="100" step="1" value="1"><output id="speed-value">1×</output></div>
      <span><i></i>Prioritized</span>
      <span><i class="standard"></i>Standard</span>
    </div>
    <div class="airspace-layout">
      <div class="airspace">
      <canvas id="airspace" aria-label="Square airspace, x 500 meters by y 500 meters">500 m × 500 m airspace</canvas>
      <span class="x-axis">x · 500 m</span><span class="y-axis">y · 500 m</span>
      </div>
      <section class="chart" aria-label="Five-minute average outflow and accumulation">
        <div class="chart-area">
          <div class="plot-legend" aria-label="Outflow legend">
            <span class="series-total"><math><msub><mi>G</mi><mtext mathvariant="bold">tot</mtext></msub></math><span class="equals">=</span><output id="g-label">0.00</output><span>/s</span></span>
            <span class="series-standard"><math><msub><mi>G</mi><mtext mathvariant="bold">st</mtext></msub></math><span class="equals">=</span><output id="gs-label">0.00</output><span>/s</span></span>
            <span class="series-priority"><math><msub><mi>G</mi><mtext mathvariant="bold">pr</mtext></msub></math><span class="equals">=</span><output id="gp-label">0.00</output><span>/s</span></span>
          </div>
          <span class="chart-axis-label">Outflow <math><mi>G</mi></math></span>
          <span class="chart-x-label">Time [min]</span>
          <canvas id="flow-chart" aria-label="Five-minute average total, standard, and prioritized outflow versus time, left y-axis"></canvas>
        </div>
        <div class="chart-area accumulation-panel">
          <div class="plot-legend" aria-label="Accumulation legend">
            <span class="series-total"><math><msub><mi>n</mi><mtext mathvariant="bold">tot</mtext></msub></math><span class="equals">=</span><output id="n-label">0.0</output></span>
            <span class="series-standard"><math><msub><mi>n</mi><mtext mathvariant="bold">st</mtext></msub></math><span class="equals">=</span><output id="ns-label">0.0</output></span>
            <span class="series-priority"><math><msub><mi>n</mi><mtext mathvariant="bold">pr</mtext></msub></math><span class="equals">=</span><output id="np-label">0.0</output></span>
          </div>
          <span class="chart-axis-label">Accumulation <math><mi>n</mi></math></span>
          <span class="chart-x-label">Time [min]</span>
          <canvas id="accumulation-chart" aria-label="Five-minute average total, standard, and prioritized accumulation versus time, left y-axis"></canvas>
        </div>
      </section>
    </div>
    <section class="controls" aria-label="Simulation controls">
      <div class="control">
        <label for="q-range">Total inflow rate (default: 3.6) <math><msub><mi>q</mi><mtext mathvariant="bold">tot</mtext></msub></math> <span class="unit">[a.c/s]</span></label>
        <div class="control-row">
          <input id="q-range" type="range" min="0" max="5" step="0.1" value="3.6">
          <input id="q-value" type="number" min="0" max="10" step="0.01" value="3.60" aria-label="Total inflow rate in aircraft per second">
        </div>
        <div class="limits" aria-hidden="true"><span>0</span><span>5</span></div>
      </div>
      <div class="control">
        <div class="alpha-heading"><label for="alpha-range">Inflow priority ratio (default: 0.3) <math><msub><mi>α</mi><mi>f</mi></msub></math></label>
        <div class="equation"><math aria-label="q pr equals alpha f times q tot"><msub><mi>q</mi><mtext mathvariant="bold">pr</mtext></msub><mo>=</mo><msub><mi>α</mi><mi>f</mi></msub><mo>·</mo><msub><mi>q</mi><mtext mathvariant="bold">tot</mtext></msub></math></div>
        </div>
        <div class="control-row">
          <input id="alpha-range" type="range" min="0" max="1" step="0.01" value="0.3">
          <input id="alpha-value" type="number" min="0" max="1" step="0.01" value="0.30" aria-label="Inflow priority ratio alpha">
        </div>
        <div class="limits" aria-hidden="true"><span>0</span><span>1</span></div>
      </div>
      <div class="actions">
        <button id="toggle" type="button" aria-label="Start" title="Start"><img src="assets/icons/play.svg" alt=""></button><button id="reset" type="button" aria-label="Reset" title="Reset"><img src="assets/icons/rotate-ccw.svg" alt=""></button>
        <div class="visibility">
          <button id="destinations" type="button" aria-pressed="true" aria-label="Hide Destinations" title="Hide Destinations">Dest <img src="assets/icons/eye.svg" alt=""></button>
          <button id="trajectories" type="button" aria-pressed="true" aria-label="Hide Trajectories" title="Hide Trajectories">Traj <img src="assets/icons/eye.svg" alt=""></button>
        </div>
      </div>
    </section>
  </main>
  <script src="simulation.js?v=uniform-arrivals-1"></script>
  <script>
    const defaults = Object.freeze({ q: 3.6, alpha: 0.3 });
    const visibility = { destinations: true, trajectories: true };
    const simulation = new AirSimulation();
    const state = { ...defaults, speed: 1, running: false, elapsed: 0 };
    const clock = document.querySelector('#clock');
    const toggle = document.querySelector('#toggle');
    const status = document.querySelector('#status');
    const bindings = {};
    let frameId = null;
    let lastTime = null;
    const autoPauseInterval = 360 * 60;
    let nextAutoPause = autoPauseInterval;
    document.querySelector('#speed').addEventListener('input', event => {
      synchronize();
      state.speed = event.target.valueAsNumber;
      document.querySelector('#speed-value').textContent = `${state.speed}×`;
    });

    for (const key of ['q', 'alpha']) {
      const range = document.querySelector(`#${key}-range`);
      const number = document.querySelector(`#${key}-value`);
      const render = () => {
        range.value = state[key];
        number.value = state[key].toFixed(2);
      };
      const commit = () => {
        synchronize();
        if (Number.isFinite(number.valueAsNumber)) {
          state[key] = Math.round(Math.min(Number(number.max), Math.max(0, number.valueAsNumber)) * 100) / 100;
        }
        render();
      };
      range.addEventListener('input', () => { synchronize(); state[key] = range.valueAsNumber; render(); });
      number.addEventListener('input', () => {
        if (number.validity.valid && Number.isFinite(number.valueAsNumber)) {
          synchronize();
          state[key] = number.valueAsNumber;
          range.value = state[key];
        }
      });
      number.addEventListener('change', commit);
      number.addEventListener('blur', commit);
      number.addEventListener('keydown', event => { if (event.key === 'Enter') { commit(); number.blur(); } });
      bindings[key] = render;
    }

    function renderClock() {
      const seconds = Math.floor(state.elapsed);
      clock.textContent = `t = ${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
    }
    function synchronize(now = performance.now()) {
      if (state.running && lastTime !== null) {
        const remaining = Math.max(0, nextAutoPause - simulation.time);
        const elapsed = Math.max(0, now - lastTime) / 1000 * state.speed;
        simulation.advance(Math.min(elapsed, remaining), state.q, state.alpha);
        state.elapsed = simulation.time;
        lastTime = now;
        renderClock();
        drawAirspace();
        drawFlow();
        if (simulation.time >= nextAutoPause) {
          pause(false);
          renderStatus('Auto-paused');
        }
      }
    }
    function tick(now) {
      if (!state.running) return;
      if (document.hidden) { pauseWhenAway(); return; }
      synchronize(now);
      if (state.running) frameId = requestAnimationFrame(tick);
    }
    function pause(updateTime = true) {
      if (updateTime) synchronize();
      state.running = false;
      cancelAnimationFrame(frameId);
      frameId = null;
      lastTime = null;
      renderClock();
    }
    function pauseWhenAway() {
      if (!state.running) return;
      // Discard time since the last frame rather than catching up in background.
      pause(false);
      renderStatus('Auto-paused');
    }
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) pauseWhenAway();
    });
    window.addEventListener('blur', pauseWhenAway);
    window.addEventListener('pagehide', pauseWhenAway);
    function renderStatus(label) {
      status.textContent = label;
      status.dataset.running = String(state.running);
      const action = state.running ? 'Pause' : 'Start';
      toggle.setAttribute('aria-label', action);
      toggle.title = action;
      toggle.querySelector('img').src = `assets/icons/${state.running ? 'pause' : 'play'}.svg`;
    }
    toggle.addEventListener('click', () => {
      if (state.running) { pause(); renderStatus('Paused'); }
      else {
        if (document.hidden) return;
        nextAutoPause = (Math.floor(simulation.time / autoPauseInterval) + 1) * autoPauseInterval;
        state.running = true;
        lastTime = performance.now();
        frameId = requestAnimationFrame(tick);
        renderStatus('Running');
      }
    });
    document.querySelector('#reset').addEventListener('click', () => {
      pause();
      Object.assign(state, defaults, { elapsed: 0, speed: 1 });
      document.querySelector('#speed').value = 1;
      document.querySelector('#speed-value').textContent = '1×';
      simulation.reset();
      Object.values(bindings).forEach(render => render());
      renderClock();
      renderStatus('Ready');
      drawAirspace();
      drawFlow();
    });

    const canvas = document.querySelector('#airspace');
    for (const key of ['destinations', 'trajectories']) {
      const button = document.querySelector(`#${key}`);
      button.addEventListener('click', () => {
        visibility[key] = !visibility[key];
        button.setAttribute('aria-pressed', String(visibility[key]));
        const action = `${visibility[key] ? 'Hide' : 'Show'} ${key[0].toUpperCase() + key.slice(1)}`;
        button.setAttribute('aria-label', action);
        button.title = action;
        button.querySelector('img').src = `assets/icons/${visibility[key] ? 'eye' : 'eye-closed'}.svg`;
        drawAirspace();
      });
    }
    function drawAirspace() {
      const size = canvas.clientWidth;
      const scale = window.devicePixelRatio || 1;
      if (canvas.width !== Math.round(size * scale) || canvas.height !== Math.round(size * scale)) {
        canvas.width = Math.round(size * scale);
        canvas.height = Math.round(size * scale);
      }
      const ctx = canvas.getContext('2d');
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, size, size);
      ctx.strokeStyle = '#e5eceb';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 1; i < 10; i++) {
        const p = i * size / 10;
        ctx.moveTo(p, 0); ctx.lineTo(p, size);
        ctx.moveTo(0, p); ctx.lineTo(size, p);
      }
      ctx.stroke();
      // Draw route overlays first so every drone stays visible above them.
      for (const trip of simulation.drones) {
        const position = simulation.position(trip);
        const x = position.x / 500 * size;
        const y = (1 - position.y / 500) * size;
        const dx = trip.destination.x / 500 * size;
        const dy = (1 - trip.destination.y / 500) * size;
        ctx.save();
        ctx.strokeStyle = trip.kind === 'priority' ? '#d93644' : '#2478d4';
        ctx.fillStyle = ctx.strokeStyle;
        ctx.lineWidth = 1.2;
        if (visibility.trajectories) {
          ctx.globalAlpha = 0.45;
          ctx.beginPath();
          ctx.moveTo(trip.origin.x / 500 * size, (1 - trip.origin.y / 500) * size);
          for (const point of trip.trail) ctx.lineTo(point.x / 500 * size, (1 - point.y / 500) * size);
          ctx.lineTo(x, y);
          ctx.stroke();
        }
        if (visibility.destinations) {
          ctx.globalAlpha = 0.6;
          ctx.setLineDash([4, 4]);
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(dx, dy); ctx.stroke();
          ctx.setLineDash([]);
          ctx.globalAlpha = 0.5;
          ctx.beginPath();
          for (let i = 0; i < 10; i++) {
            const angle = -Math.PI / 2 + i * Math.PI / 5;
            const radius = i % 2 === 0 ? 6 : 2.5;
            const px = dx + Math.cos(angle) * radius;
            const py = dy + Math.sin(angle) * radius;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.closePath(); ctx.fill();
        }
        ctx.restore();
      }
      for (const trip of simulation.drones) {
        const position = simulation.position(trip);
        const x = position.x / 500 * size;
        const y = (1 - position.y / 500) * size;
        const angle = Math.atan2(-trip.vy, trip.vx);
        ctx.strokeStyle = trip.kind === 'priority' ? '#d93644' : '#2478d4';
        ctx.fillStyle = ctx.strokeStyle;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x - Math.cos(angle) * 10, y - Math.sin(angle) * 10);
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
      }
    }
    new ResizeObserver(drawAirspace).observe(canvas);
    const flowChart = document.querySelector('#flow-chart');
    const accumulationChart = document.querySelector('#accumulation-chart');
    function drawFlow() {
      const gLabel = document.querySelector('#g-label');
      const nLabel = document.querySelector('#n-label');
      const gText = simulation.flowLabels.g.toFixed(2);
      const nText = simulation.flowLabels.n.toFixed(1);
      if (gLabel.textContent !== gText) gLabel.textContent = gText;
      if (nLabel.textContent !== nText) nLabel.textContent = nText;
      for (const key of ['gs', 'gp', 'ns', 'np']) {
        const label = document.querySelector(`#${key}-label`);
        const text = simulation.classFlowLabels[key].toFixed(key.startsWith('g') ? 2 : 1);
        if (label.textContent !== text) label.textContent = text;
      }
      const points = simulation.flowHistory.map((p, i) => ({ ...p, ...simulation.classFlowHistory[i] }));
      drawTimePlot(flowChart, points, 'g');
      drawTimePlot(accumulationChart, points, 'n');
    }
    function drawTimePlot(target, points, quantity) {
      const width = target.clientWidth, height = target.clientHeight;
      const scale = window.devicePixelRatio || 1;
      if (target.width !== Math.round(width * scale) || target.height !== Math.round(height * scale)) {
        target.width = Math.round(width * scale); target.height = Math.round(height * scale);
      }
      const ctx = target.getContext('2d');
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.clearRect(0, 0, width, height);
      const { start, end } = simulation.completionSummary();
      const left = 48, right = width - 12, top = 12, bottom = height - 44;
      const keys = [quantity, `${quantity}s`, `${quantity}p`];
      const colors = ['#007f76', '#2478d4', '#d93644'];
      // Reserve enough vertical headroom for all three in-plot legend rows.
      const maximum = Math.max(quantity === 'g' ? 0.1 : 1, ...points.flatMap(p => keys.map(key => p[key]))) * 1.6;
      const x = t => left + (t - start) / (end - start) * (right - left);
      const y = (v, max) => bottom - v / max * (bottom - top);
      ctx.font = '11px system-ui'; ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const py = y(i / 4, 1);
        ctx.strokeStyle = '#dbe2e1'; ctx.beginPath(); ctx.moveTo(left, py); ctx.lineTo(right, py); ctx.stroke();
        ctx.fillStyle = '#596767'; ctx.textAlign = 'right'; ctx.fillText((maximum * i / 4).toFixed(quantity === 'g' ? 2 : 1), left - 6, py + 4);
      }
      ctx.fillStyle = '#596767'; ctx.textAlign = 'center';
      for (let t = Math.ceil(start / 120) * 120; t <= end; t += 120) ctx.fillText(String(t / 60), x(t), bottom + 18);
      ctx.strokeStyle = '#788d8b'; ctx.beginPath();
      ctx.moveTo(left, top); ctx.lineTo(left, bottom); ctx.lineTo(right, bottom); ctx.stroke();
      ctx.save(); ctx.beginPath(); ctx.rect(left, top, right - left, bottom - top); ctx.clip();
      for (const [series, key] of keys.entries()) {
        ctx.strokeStyle = colors[series]; ctx.lineWidth = 2; ctx.setLineDash([]); ctx.beginPath();
        points.forEach((point, i) => { if (i === 0) ctx.moveTo(x(point.time), y(point[key], maximum)); else ctx.lineTo(x(point.time), y(point[key], maximum)); });
        ctx.stroke();
      }
      ctx.restore();
    }
    new ResizeObserver(drawFlow).observe(flowChart);
    new ResizeObserver(drawFlow).observe(accumulationChart);
    drawFlow();
    drawAirspace();
  </script>
</body>
</html>
