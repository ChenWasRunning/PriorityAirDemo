<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PriorityAirDemo</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #243334; background: #f5f7f7; font-size: 14px; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100%, 1000px); margin: 0 auto; padding: 24px 24px 32px; }
    .meta, .legend, .controls { max-width: 612px; }
    .airspace-layout { display: grid; grid-template-columns: minmax(0, 612px) minmax(260px, 1fr); gap: 28px; align-items: start; }
    .chart { min-width: 0; }
    .chart h2 { font-size: 14px; font-weight: 500; margin: 0 0 12px; }
    #completed-chart { aspect-ratio: auto; height: 280px; border: 0; background: transparent; }
    .time-controls { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    #speed { width: 90px; }
    #speed-value { min-width: 32px; }
    #clock { min-width: 90px; text-align: right; }
    @media (max-width: 850px) {
      main { max-width: 660px; }
      .airspace-layout { grid-template-columns: minmax(0, 1fr); gap: 8px; }
    }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    h1 { font-size: 22px; margin: 0; font-weight: 650; }
    .status { display: flex; gap: 7px; align-items: center; font-size: 12px; color: #596767; }
    .status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #849292; }
    .status[data-running="true"]::before { background: #007f76; }
    .meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; font-size: 12px; margin-bottom: 10px; color: #596767; }
    output { font-variant-numeric: tabular-nums; }
    .airspace { position: relative; padding: 0 0 28px 28px; }
    .legend { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px 16px; margin-bottom: 10px; font-size: 12px; }
    .legend output { color: #596767; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 8px; height: 8px; border-radius: 50%; background: #d93644; }
    .legend .standard { background: #2478d4; }
    .equation { margin: 4px 0 10px; color: #596767; }
    math { font-size: 16px; }
    canvas { display: block; width: 100%; aspect-ratio: 1; background: #fff; border: 1px solid #788d8b; }
    .x-axis { position: absolute; bottom: 4px; left: 28px; right: 0; text-align: center; font-size: 12px; }
    .y-axis { position: absolute; left: 0; top: 0; bottom: 28px; writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-size: 12px; }
    .controls { margin-top: 16px; }
    .control { margin-bottom: 20px; }
    .control label { display: block; margin-bottom: 8px; font-weight: 550; }
    .unit { font-weight: 400; color: #687878; }
    .control-row { display: grid; grid-template-columns: minmax(0, 1fr) 88px; gap: 18px; align-items: center; }
    input[type="range"] { width: 100%; margin: 0; height: 32px; accent-color: #007f76; cursor: pointer; }
    #alpha-range { accent-color: #ba5c39; }
    input[type="number"] { width: 100%; height: 36px; padding: 6px 8px; background: white; border: 1px solid #b8c4c3; border-radius: 4px; font: inherit; font-variant-numeric: tabular-nums; }
    .limits { display: flex; justify-content: space-between; margin-right: 106px; font-size: 11px; color: #718080; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; border-top: 1px solid #dbe2e1; padding-top: 18px; }
    .visibility { display: flex; gap: 8px; margin-left: auto; }
    .visibility button { min-width: 0; padding: 0 10px; font-size: 12px; }
    .visibility button[aria-pressed="true"] { background: #e8f2f0; border-color: #8aada7; }
    @media (max-width: 580px) { .visibility { flex-basis: 100%; justify-content: flex-end; } }
    button { min-width: 112px; height: 40px; padding: 0 18px; font: inherit; font-weight: 550; border: 1px solid #b8c4c3; border-radius: 4px; background: white; color: #243334; cursor: pointer; }
    #toggle { background: #007f76; border-color: #007f76; color: white; }
    button:hover { filter: brightness(.95); }
    :focus-visible { outline: 3px solid #65acda; outline-offset: 3px; }
    @media (max-width: 400px) { main { padding: 18px 16px; } h1 { font-size: 20px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>PriorityAirDemo</h1>
      <span id="status" class="status" data-running="false" role="status">Ready</span>
    </header>
    <div class="meta"><span>2D airspace · 500 m × 500 m</span>
      <div class="time-controls"><label for="speed">Speed</label><input id="speed" type="range" min="1" max="100" step="1" value="1"><output id="speed-value">1×</output><output id="clock" aria-label="Simulation time">t = 0.0 s</output></div>
    </div>
    <div class="legend" aria-label="Drone classes">
      <span><i></i>Prioritized · <output id="next-priority"></output></span>
      <span><i class="standard"></i>Standard · <output id="next-standard"></output></span>
    </div>
    <div class="airspace-layout">
      <div class="airspace">
      <canvas id="airspace" aria-label="Square airspace, x 500 meters by y 500 meters">500 m × 500 m airspace</canvas>
      <span class="x-axis">x · 500 m</span><span class="y-axis">y · 500 m</span>
      </div>
      <section class="chart" aria-label="Completed trips over time">
        <h2>Completed trips <math><msub><mi>N</mi><mtext>comp</mtext></msub></math> = <output id="completed-count">0</output></h2>
        <canvas id="completed-chart" aria-label="Cumulative completed trips versus simulation time in minutes"></canvas>
      </section>
    </div>
    <section class="controls" aria-label="Simulation controls">
      <div class="control">
        <label for="q-range">Total inflow rate <math><msub><mi>q</mi><mtext>total</mtext></msub></math> <span class="unit">[a.c/s]</span></label>
        <div class="control-row">
          <input id="q-range" type="range" min="0" max="1" step="0.01" value="0.5">
          <input id="q-value" type="number" min="0" max="1" step="0.01" value="0.50" aria-label="Total inflow rate in aircraft per second">
        </div>
        <div class="limits" aria-hidden="true"><span>0</span><span>1</span></div>
      </div>
      <div class="control">
        <label for="alpha-range">Inflow priority ratio <math><mi>α</mi></math></label>
        <div class="equation"><math aria-label="q priority equals alpha times q total"><msub><mi>q</mi><mtext>priority</mtext></msub><mo>=</mo><mi>α</mi><mo>·</mo><msub><mi>q</mi><mtext>total</mtext></msub></math></div>
        <div class="control-row">
          <input id="alpha-range" type="range" min="0" max="1" step="0.01" value="0">
          <input id="alpha-value" type="number" min="0" max="1" step="0.01" value="0.00" aria-label="Inflow priority ratio alpha">
        </div>
        <div class="limits" aria-hidden="true"><span>0</span><span>1</span></div>
      </div>
      <div class="actions">
        <button id="toggle" type="button">Start</button><button id="reset" type="button">Reset</button>
        <div class="visibility">
          <button id="destinations" type="button" aria-pressed="true">Hide Destinations</button>
          <button id="trajectories" type="button" aria-pressed="true">Hide Trajectories</button>
        </div>
      </div>
    </section>
  </main>
  <script src="simulation.js?v=completed-trips-1"></script>
  <script>
    const defaults = Object.freeze({ q: 0.5, alpha: 0 });
    const visibility = { destinations: true, trajectories: true };
    const simulation = new AirSimulation();
    const state = { ...defaults, speed: 1, running: false, elapsed: 0 };
    const clock = document.querySelector('#clock');
    const toggle = document.querySelector('#toggle');
    const status = document.querySelector('#status');
    const bindings = {};
    let frameId = null;
    let lastTime = null;
    document.querySelector('#speed').addEventListener('input', event => {
      synchronize();
      state.speed = event.target.valueAsNumber;
      document.querySelector('#speed-value').textContent = `${state.speed}×`;
    });

    for (const key of ['q', 'alpha']) {
      const range = document.querySelector(`#${key}-range`);
      const number = document.querySelector(`#${key}-value`);
      const render = () => {
        range.value = state[key];
        number.value = state[key].toFixed(2);
        renderEntries();
      };
      const commit = () => {
        synchronize();
        if (Number.isFinite(number.valueAsNumber)) {
          state[key] = Math.round(Math.min(1, Math.max(0, number.valueAsNumber)) * 100) / 100;
        }
        render();
      };
      range.addEventListener('input', () => { synchronize(); state[key] = range.valueAsNumber; render(); });
      number.addEventListener('input', () => {
        if (number.validity.valid && Number.isFinite(number.valueAsNumber)) {
          synchronize();
          state[key] = number.valueAsNumber;
          range.value = state[key];
          renderEntries();
        }
      });
      number.addEventListener('change', commit);
      number.addEventListener('blur', commit);
      number.addEventListener('keydown', event => { if (event.key === 'Enter') { commit(); number.blur(); } });
      bindings[key] = render;
    }

    function renderEntries() {
      const rates = { priority: state.q * state.alpha, standard: state.q * (1 - state.alpha) };
      for (const kind of ['priority', 'standard']) {
        const time = rates[kind] > 0
          ? `${(simulation.time + simulation.remaining[kind] / rates[kind]).toFixed(1)} sec`
          : '—';
        document.querySelector(`#next-${kind}`).textContent = `Next entry at ${time}`;
      }
    }
    function renderClock() {
      clock.textContent = `t = ${state.elapsed.toFixed(1)} s`;
      renderEntries();
    }
    function synchronize(now = performance.now()) {
      if (state.running && lastTime !== null) {
        simulation.advance(Math.max(0, now - lastTime) / 1000 * state.speed, state.q, state.alpha);
        state.elapsed = simulation.time;
        lastTime = now;
        renderClock();
        drawAirspace();
        drawCompleted();
      }
    }
    function tick(now) {
      if (!state.running) return;
      synchronize(now);
      frameId = requestAnimationFrame(tick);
    }
    function pause() {
      synchronize();
      state.running = false;
      cancelAnimationFrame(frameId);
      frameId = null;
      lastTime = null;
      renderClock();
    }
    function renderStatus(label) {
      status.textContent = label;
      status.dataset.running = String(state.running);
      toggle.textContent = state.running ? 'Pause' : 'Start';
    }
    toggle.addEventListener('click', () => {
      if (state.running) { pause(); renderStatus('Paused'); }
      else {
        state.running = true;
        lastTime = performance.now();
        frameId = requestAnimationFrame(tick);
        renderStatus('Running');
      }
    });
    document.querySelector('#reset').addEventListener('click', () => {
      pause();
      Object.assign(state, defaults, { elapsed: 0, speed: 1 });
      document.querySelector('#speed').value = 1;
      document.querySelector('#speed-value').textContent = '1×';
      simulation.reset();
      Object.values(bindings).forEach(render => render());
      renderClock();
      renderStatus('Ready');
      drawAirspace();
      drawCompleted();
    });

    const canvas = document.querySelector('#airspace');
    for (const key of ['destinations', 'trajectories']) {
      const button = document.querySelector(`#${key}`);
      button.addEventListener('click', () => {
        visibility[key] = !visibility[key];
        button.setAttribute('aria-pressed', String(visibility[key]));
        button.textContent = `${visibility[key] ? 'Hide' : 'Show'} ${key[0].toUpperCase() + key.slice(1)}`;
        drawAirspace();
      });
    }
    function drawAirspace() {
      const size = canvas.clientWidth;
      const scale = window.devicePixelRatio || 1;
      if (canvas.width !== Math.round(size * scale) || canvas.height !== Math.round(size * scale)) {
        canvas.width = Math.round(size * scale);
        canvas.height = Math.round(size * scale);
      }
      const ctx = canvas.getContext('2d');
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, size, size);
      ctx.strokeStyle = '#e5eceb';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 1; i < 10; i++) {
        const p = i * size / 10;
        ctx.moveTo(p, 0); ctx.lineTo(p, size);
        ctx.moveTo(0, p); ctx.lineTo(size, p);
      }
      ctx.stroke();
      // Draw route overlays first so every drone stays visible above them.
      for (const trip of simulation.drones) {
        const position = simulation.position(trip);
        const x = position.x / 500 * size;
        const y = (1 - position.y / 500) * size;
        const dx = trip.destination.x / 500 * size;
        const dy = (1 - trip.destination.y / 500) * size;
        ctx.save();
        ctx.strokeStyle = trip.kind === 'priority' ? '#d93644' : '#2478d4';
        ctx.fillStyle = ctx.strokeStyle;
        ctx.lineWidth = 1.2;
        if (visibility.trajectories) {
          ctx.globalAlpha = 0.45;
          ctx.beginPath();
          ctx.moveTo(trip.origin.x / 500 * size, (1 - trip.origin.y / 500) * size);
          ctx.lineTo(x, y);
          ctx.stroke();
        }
        if (visibility.destinations) {
          ctx.globalAlpha = 0.6;
          ctx.setLineDash([4, 4]);
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(dx, dy); ctx.stroke();
          ctx.setLineDash([]);
          ctx.globalAlpha = 0.9;
          ctx.beginPath();
          for (let i = 0; i < 10; i++) {
            const angle = -Math.PI / 2 + i * Math.PI / 5;
            const radius = i % 2 === 0 ? 6 : 2.5;
            const px = dx + Math.cos(angle) * radius;
            const py = dy + Math.sin(angle) * radius;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.closePath(); ctx.fill();
        }
        ctx.restore();
      }
      for (const trip of simulation.drones) {
        const position = simulation.position(trip);
        const x = position.x / 500 * size;
        const y = (1 - position.y / 500) * size;
        const angle = Math.atan2(-(trip.destination.y - trip.origin.y), trip.destination.x - trip.origin.x);
        ctx.strokeStyle = trip.kind === 'priority' ? '#d93644' : '#2478d4';
        ctx.fillStyle = ctx.strokeStyle;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x - Math.cos(angle) * 10, y - Math.sin(angle) * 10);
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
      }
    }
    new ResizeObserver(drawAirspace).observe(canvas);
    const chart = document.querySelector('#completed-chart');
    function drawCompleted() {
      document.querySelector('#completed-count').textContent = simulation.completed;
      const width = chart.clientWidth, height = chart.clientHeight;
      const scale = window.devicePixelRatio || 1;
      if (chart.width !== Math.round(width * scale) || chart.height !== Math.round(height * scale)) {
        chart.width = Math.round(width * scale); chart.height = Math.round(height * scale);
      }
      const ctx = chart.getContext('2d');
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.clearRect(0, 0, width, height);
      const left = 48, right = width - 12, top = 12, bottom = height - 44;
      const start = Math.max(0, simulation.time - 600);
      const end = Math.max(60, simulation.time);
      const maxCount = Math.max(5, Math.ceil(simulation.completed / 5) * 5);
      const x = time => left + (time - start) / (end - start) * (right - left);
      const y = count => bottom - count / maxCount * (bottom - top);
      ctx.font = '11px system-ui';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const value = Math.round(maxCount * i / 4);
        ctx.strokeStyle = '#dbe2e1';
        ctx.beginPath(); ctx.moveTo(left, y(value)); ctx.lineTo(right, y(value)); ctx.stroke();
        ctx.fillStyle = '#596767'; ctx.textAlign = 'right';
        ctx.fillText(String(value), left - 7, y(value) + 4);
      }
      const tickStep = end - start > 300 ? 120 : 60;
      ctx.textAlign = 'center';
      for (let time = Math.ceil(start / tickStep) * tickStep; time <= end; time += tickStep) {
        ctx.fillText(String(time / 60), x(time), bottom + 18);
      }
      ctx.fillText('Time [min]', (left + right) / 2, height - 5);
      ctx.save(); ctx.translate(12, (top + bottom) / 2); ctx.rotate(-Math.PI / 2);
      ctx.fillText('N_comp [trips]', 0, 0); ctx.restore();
      ctx.strokeStyle = '#788d8b'; ctx.beginPath();
      ctx.moveTo(left, top); ctx.lineTo(left, bottom); ctx.lineTo(right, bottom); ctx.stroke();
      ctx.save(); ctx.beginPath(); ctx.rect(left, top, right - left, bottom - top); ctx.clip();
      ctx.strokeStyle = '#007f76'; ctx.lineWidth = 2; ctx.beginPath();
      let previous = simulation.completionHistory[0].count;
      ctx.moveTo(x(start), y(previous));
      for (const point of simulation.completionHistory) {
        if (point.time < start) continue;
        ctx.lineTo(x(point.time), y(previous)); ctx.lineTo(x(point.time), y(point.count));
        previous = point.count;
      }
      ctx.lineTo(x(simulation.time), y(previous)); ctx.stroke(); ctx.restore();
    }
    new ResizeObserver(drawCompleted).observe(chart);
    drawCompleted();
    drawAirspace();
    renderEntries();
  </script>
</body>
</html>
